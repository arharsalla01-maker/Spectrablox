<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRABLOX - ELGRINGO</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1>SPECTRABLOX</h1>
                    <span class="subtitle">ELGRINGO</span>
                </div>
                <div class="header-actions">
                    <button id="login-btn" class="login-btn">
                        <i class="fab fa-discord"></i>
                        Login
                    </button>
                    <div id="user-info" class="user-info" style="display: none;">
                        <img id="user-avatar" src="" alt="User" class="user-avatar">
                        <span id="user-name" class="user-name"></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <div class="tab active" data-filter="all">Feed</div>
                <div class="tab" data-filter="free">Free</div>
                <div class="tab" data-filter="new">New</div>
            </div>

            <!-- Upload Button -->
            <div class="upload-section">
                <button id="upload-btn" class="upload-btn">
                    <i class="fas fa-plus"></i>
                    Subir Brainrot
                </button>
            </div>

            <!-- Items Grid -->
            <div id="items-grid" class="items-grid">
                <!-- Items will be loaded here -->
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-page="feed">
                <i class="fas fa-home"></i>
                <span>Feed</span>
            </div>
            <div class="nav-item" data-page="chats">
                <i class="fas fa-comments"></i>
                <span>Chats</span>
            </div>
            <div class="nav-item" data-page="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </div>
        </nav>

        <!-- Upload Modal -->
        <div id="upload-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Subir Brainrot</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <form id="upload-form" class="upload-form">
                    <div class="form-group">
                        <label>ID de Roblox</label>
                        <input type="text" id="roblox-id" name="robloxId" required placeholder="Tu ID de Roblox">
                    </div>
                    <div class="form-group">
                        <label>URL de la Imagen</label>
                        <input type="url" id="image-url" name="imageUrl" required placeholder="https://ejemplo.com/imagen.png">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="description" name="description" rows="3" placeholder="Describe tu brainrot..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Subir</button>
                </form>
            </div>
        </div>

        <!-- Item Detail Modal -->
        <div id="item-modal" class="modal">
            <div class="modal-content item-modal-content">
                <button class="close-btn">&times;</button>
                <img id="modal-image" src="" alt="Brainrot" class="modal-image">
                <div class="modal-item-info">
                    <div class="modal-user">
                        <img id="modal-avatar" src="" alt="User" class="modal-avatar">
                        <div class="modal-user-details">
                            <h3 id="modal-username"></h3>
                            <p id="modal-roblox-id"></p>
                        </div>
                    </div>
                    <p id="modal-description" class="modal-description"></p>
                    <div class="modal-actions">
                        <button class="trade-btn">
                            <i class="fas fa-exchange-alt"></i>
                            Trade
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
